<style>
:root{
  --navy:#1f2f4a; --navy-2:#2c4166; --gold:#b8913a; --gold-soft:#f4ead3;
  --bg:#f3f4f7; --card:#ffffff; --line:#dfe3ea; --text:#1d2433; --muted:#667085;
  --yes:#1f7a4d; --yes-bg:#e3f4ea; --no:#b42318; --no-bg:#fde8e6;
  --abs:#8a6d1f; --abs-bg:#fbf1d6; --rec:#4b5563; --rec-bg:#eceef2;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff}
.hdr{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr img{width:44px;height:44px;border-radius:9px;flex:none}
.hdr h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.2px}
.hdr .sub{font-size:12px;color:#c9d3e6}
.hdr .sp{flex:1}
.hdr .who{font-size:13px;color:#dfe6f3;text-align:right}
.hbtn{background:transparent;border:1px solid #4d6390;color:#fff;border-radius:7px;padding:6px 10px;font-size:13px}
@media(max-width:600px){.hdr .sp{display:none}.hdr .who{text-align:left;flex-basis:100%}}
.hbtn:hover{background:var(--navy-2)}
nav{background:var(--navy-2)}
.tabs{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:none;color:#c9d3e6;padding:11px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-size:14px}
.tab.on{color:#fff;border-bottom-color:var(--gold);font-weight:600}
.tab .lock{font-size:11px;opacity:.8;margin-left:4px}
main{max-width:1200px;margin:0 auto;padding:20px 16px 40px}
footer{max-width:1200px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.bar h2{margin:0;font-size:20px}
.bar .sp{flex:1}
.hint{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:14px;color:var(--text)}
.btn:hover{background:#f7f8fa}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--no);border-color:#f1b8b2}
.btn.danger:hover{background:var(--no-bg)}
.btn.sm{padding:4px 9px;font-size:13px}
.link{background:none;border:none;color:var(--navy-2);padding:0;text-decoration:underline;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.chead{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;flex-wrap:wrap}
.chead:hover{background:#fafbfc}
.chev{width:18px;color:var(--muted);transition:transform .15s;flex:none}
.card.open .chev{transform:rotate(90deg)}
.ctitle{font-weight:600;font-size:16px}
.cmeta{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:#e8edf6;color:var(--navy-2);white-space:nowrap}
.badge.req{background:var(--gold-soft);color:#7a5c12}
.tally{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:12.5px;padding:3px 9px;border-radius:20px;background:#eef0f4;white-space:nowrap}
.pill.y{background:var(--yes-bg);color:var(--yes);font-weight:600}
.pill.n{background:var(--no-bg);color:var(--no);font-weight:600}
.pill.a{background:var(--abs-bg);color:var(--abs)}
.pill.r{background:var(--rec-bg);color:var(--rec)}
.cright{margin-left:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.myvote{font-weight:600}
.cbody{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:1.25fr 1fr;gap:22px}
@media(max-width:820px){.cbody{grid-template-columns:1fr}}
.sec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sec+.sec{margin-top:18px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
@media(max-width:520px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.summary{white-space:pre-wrap;font-size:14.5px;overflow-wrap:anywhere}
.docs{list-style:none;margin:0;padding:0}
.docs li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.docs li:last-child{border-bottom:none}
.pdf{font-size:10px;font-weight:700;background:#c0392b;color:#fff;border-radius:3px;padding:1px 4px;flex:none}
.doclink{background:none;border:none;padding:0;color:var(--navy-2);text-decoration:underline;text-align:left;font-size:14px;overflow-wrap:anywhere}
.docs .x{margin-left:auto}
.votebtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.vb{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font-weight:600}
.vb.y.on{background:var(--yes);border-color:var(--yes);color:#fff}
.vb.n.on{background:var(--no);border-color:var(--no);color:#fff}
.vb.a.on{background:var(--abs);border-color:var(--abs);color:#fff}
.vb.r.on{background:var(--rec);border-color:var(--rec);color:#fff}
.voters{font-size:13.5px}
.voters div{margin:3px 0}
.voters .lbl{display:inline-block;min-width:92px;font-weight:600}
.comment{padding:10px 0;border-bottom:1px solid var(--line)}
.comment:last-child{border-bottom:none}
.comment .ch{display:flex;gap:8px;align-items:baseline;font-size:13px;flex-wrap:wrap}
.comment .ch b{font-size:14px}
.comment .ch .when{color:var(--muted)}
.comment .ch .acts{margin-left:auto;display:flex;gap:10px}
.comment .txt{white-space:pre-wrap;font-size:14px;margin-top:3px;overflow-wrap:anywhere}
.addc{display:flex;gap:8px;margin-top:10px}
.addc textarea,.addc input{flex:1}
textarea,input[type=text],input[type=email],input[type=password],input[type=date],select{border:1px solid #cfd5df;border-radius:7px;padding:7px 9px;background:#fff;width:100%}
textarea{min-height:60px;resize:vertical}
.chairbar{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}
.chairbar .lbl{font-size:12px;color:var(--muted);align-self:center;margin-right:4px}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:#f6f7f9;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
td.w-court{min-width:120px}td.w-auth{min-width:190px}td.w-date{min-width:120px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;min-width:220px;white-space:pre-wrap}
.clamp.open{display:block}
.res{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block}
.res.fav{background:var(--yes-bg);color:var(--yes)}
.res.unf{background:var(--no-bg);color:var(--no)}
.res.mix{background:var(--abs-bg);color:var(--abs)}
.res.nr{background:#e3ecf8;color:#2c4f86}
.res.tbd{background:#eceef2;color:#4b5563}
.status-latest{font-size:13.5px}
.status-latest .d,.hist .d{color:var(--muted);font-size:12px}
.hist{background:#fafbfc}
.hist ul{list-style:none;margin:0;padding:0}
.hist li{padding:5px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.hist li:last-child{border-bottom:none}
.hist .d{margin-right:6px}
.section-title{font-size:16px;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-title .count{font-size:12px;background:#e8edf6;color:var(--navy-2);border-radius:20px;padding:1px 8px}
.step{display:grid;grid-template-columns:28px 230px 150px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step input[type=checkbox]{width:18px;height:18px;margin-top:6px}
.step .nm{font-weight:600;padding-top:5px;font-size:14px}
.step .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.step.done .nm{color:var(--yes)}
@media(max-width:820px){.step{grid-template-columns:28px 1fr}.step>*:nth-child(n+3){grid-column:2}}
.extra{grid-column:2/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:4px}
.authpick{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.due{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px}
.due.soon{background:var(--abs-bg);color:var(--abs)}
.due.over{background:var(--no-bg);color:var(--no)}
.due.ok{background:#eef0f4;color:var(--muted)}
.progress{height:6px;background:#eceef2;border-radius:6px;overflow:hidden;width:120px}
.progress span{display:block;height:100%;background:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:12px;max-width:680px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
label.f{display:block;font-size:12.5px;font-weight:600;color:#475467}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{border:none;background:#fff;padding:7px 14px}
.seg button.on{background:var(--navy);color:#fff}
.warnbox{background:var(--no-bg);border:1px solid #f4c3bd;color:#7a1b12;border-radius:8px;padding:10px 12px;font-size:14px}
.infobox{background:#eef3fb;border:1px solid #cfdbef;border-radius:8px;padding:10px 12px;font-size:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
.toast.err{background:var(--no)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;max-width:400px;width:100%;text-align:center}
.login img{width:96px;height:96px;border-radius:18px}
.login .fgrid{grid-template-columns:1fr;text-align:left;margin-top:16px}
.login .err{color:var(--no);font-size:14px;min-height:1em}
.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.muted{color:var(--muted)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.temp-pw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;background:#f6f7f9;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center;user-select:all}
