/* ---------- Small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => { if (!d) return ''; const [y,m,dd] = String(d).slice(0,10).split('-'); return `${m}/${dd}/${y}`; };
const fmtStamp = iso => { if (!iso) return ''; const d = new Date(iso);
  return d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}) + ' ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); };
const localDay = iso => { const d = new Date(iso); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const isChair = () => S.me && S.me.role === 'chair';
const isViewer = () => S.me && S.me.role === 'viewer';
const today = () => (S.review && S.review.today) || (S.board && S.board.today) || localDay(new Date().toISOString());
const daysTo = d => Math.round((new Date(d + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 86400000);
function toast(msg, isErr){ document.querySelectorAll('.toast').forEach(x => x.remove()); const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' err' : ''); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), isErr ? 5000 : 2600); }
function openModal(html){ closeModal(); const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal'; bg.innerHTML = `<div class="modal">${html}</div>`; bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); }); document.body.appendChild(bg); const f = bg.querySelector('input,textarea,select'); if (f) f.focus(); }
function closeModal(){ const m = $('#modal'); if (m) m.remove(); }
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
async function run(fn, btn){            // wraps any async action with error display
  if (btn) btn.disabled = true;
  try { return await fn(); }
  catch (e) { toast(e.message || 'Something went wrong', true); }
  finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
}

/* ---------- Session storage (wrapped: storage can be unavailable) ---------- */
function saveSession(s){ S.session = s; try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch(e){} }
function loadSession(){ try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e){ return null; } }

/* ---------- Worker API ---------- */
async function post(action, payload, token){
  const res = await fetch(WORKER_URL, { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ appId: APP_ID, action, token, payload: payload || {} }) });
  let data = {}; try { data = await res.json(); } catch(e){}
  return { ok: res.ok, status: res.status, data };
}
async function refreshSession(){
  if (!S.session || !S.session.refresh_token) return false;
  const r = await post('refresh', { refresh_token: S.session.refresh_token });
  if (r.ok && r.data.session) { saveSession(r.data.session); return true; }
  return false;
}
async function api(action, payload){
  if (S.session && S.session.expires_at && S.session.expires_at - Date.now()/1000 < 120) await refreshSession();
  let r = await post(action, payload, S.session && S.session.access_token);
  if (r.status === 401 && await refreshSession()) r = await post(action, payload, S.session.access_token);
  if (r.status === 401) { signOut('Your session has expired. Please sign in again.'); throw new Error('Please sign in again.'); }
  if (!r.ok) throw new Error(r.data.error || ('Error ' + r.status));
  return r.data;
}

/* ---------- Auth flow ---------- */
async function boot(){
  const s = loadSession();
  if (s) {
    S.session = s;
    try { const r = await api('me'); S.me = r.me; return enterApp(); }
    catch(e){ /* falls through to sign-in */ }
  }
  S.screen = 'login'; render();
}
function enterApp(){
  S.screen = 'app';
  S.tab = isViewer() ? 'breview' : 'review';
  render(); loadTab();
}
function signOut(msg){
  saveSession(null); S.me = null; S.review = S.board = S.tracker = S.users = S.breview = null;
  S.open = {}; S.showAll = {}; S.hist = {}; S.editing = null; closeModal();
  S.screen = 'login'; S.authMsg = msg || ''; render();
}
async function doSignIn(btn){
  S.authMsg = '';
  await run(async () => {
    const r = await post('signIn', { email: val('li_email'), password: val('li_pw') });
    if (!r.ok) { S.authMsg = r.data.error || 'Sign-in failed.'; return render(); }
    if (r.data.pending) { S.screen = 'pending'; return render(); }
    saveSession(r.data.session); S.me = r.data.me; enterApp();
  }, btn);
}
async function doSignUp(btn){
  S.authMsg = '';
  if (val('su_pw') !== val('su_pw2')) { S.authMsg = 'The two passwords do not match.'; return render(true); }
  await run(async () => {
    const r = await post('signUp', { name: val('su_name'), email: val('su_email'), password: val('su_pw') });
    if (!r.ok) { S.authMsg = r.data.error || 'Could not create account.'; return render(true); }
    if (r.data.pending) { S.screen = 'pending'; return render(); }
    saveSession(r.data.session); S.me = r.data.me; enterApp();
    toast(`Welcome, ${r.data.me.name}!`);
  }, btn);
}

/* ---------- Data loading ---------- */
async function loadTab(){
  const t = S.tab;
  await run(async () => {
    if (t === 'review')  S.review  = await api('getReview');
    if (t === 'board')   S.board   = await api('getBoard');
    if (t === 'tracker') S.tracker = await api('getTracker');
    if (t === 'users')   S.users   = await api('listUsers');
    if (t === 'breview') S.breview = await api('getBoardReview');
    if (S.tab === t) render();
  });
}
function go(tab){ S.tab = tab; S.hist = {}; S.editing = null; render(); loadTab(); }

/* ---------- PDF upload / open ---------- */
async function uploadPdf(target, file){         // target = {case_id} or {board_id}
  if (!file) return;
  if (!/\.pdf$/i.test(file.name) || (file.type && file.type !== 'application/pdf')) throw new Error(`${file.name} is not a PDF.`);
  if (file.size > MAX_PDF_BYTES) throw new Error(`${file.name} is larger than 25 MB.`);
  const link = await api('getUploadLink', { ...target, file_name: file.name, content_type: 'application/pdf', file_size: file.size });
  const put = await fetch(link.uploadUrl, { method:'PUT', headers:{ 'Content-Type':'application/pdf' }, body: file });
  if (!put.ok) throw new Error(`Upload of ${file.name} failed (${put.status}).`);
  await api('recordDocument', { ...target, storage_path: link.storage_path, file_name: file.name, file_size: file.size });
}
async function uploadMany(target, files){
  const list = [...(files || [])]; let ok = 0;
  for (let i = 0; i < list.length; i++) {
    toast(`Uploading ${i+1} of ${list.length}: ${list[i].name}…`);
    try { await uploadPdf(target, list[i]); ok++; } catch(e) { toast(e.message, true); await new Promise(r => setTimeout(r, 1500)); }
  }
  if (list.length) toast(`${ok} of ${list.length} PDF(s) uploaded`);
  return ok;
}
async function openDoc(id){
  const w = window.open('', '_blank');           // opened now so pop-up blockers allow it
  try {
    const r = await api('getDocLink', { id });
    if (w) w.location.href = r.url; else window.location.href = r.url;
  } catch(e) { if (w) w.close(); toast(e.message, true); }
}
</script>
<script>
/* ============================================================
   RENDERING
   ============================================================ */
function render(keep){
  const saved = {};
  if (keep) document.querySelectorAll('#root input[id], #root textarea[id]').forEach(el => { if (el.type !== 'file' && el.type !== 'checkbox') saved[el.id] = el.value; });
  const root = $('#root');
  if (S.screen === 'loading') root.innerHTML = '<div class="loading">Loading…</div>';
  else if (S.screen !== 'app') root.innerHTML = renderAuth();
  else root.innerHTML = renderShell();
  if (keep) Object.entries(saved).forEach(([id, v]) => { const el = document.getElementById(id); if (el) el.value = v; });
}

function renderAuth(){
  const logo = `<img src="${ICON}" alt=""><h2 style="margin:12px 0 2px">IDC Amicus Committee</h2>`;
  const err = `<div class="err" id="auth_err">${esc(S.authMsg)}</div>`;
  if (S.screen === 'pending') return `<div class="login-wrap"><div class="login">${logo}
    <div class="infobox" style="margin-top:16px;text-align:left">Your account was created and is <b>waiting for approval</b> by the Committee Chair. You’ll be able to sign in once you’re approved.</div>
    <div class="mfoot" style="justify-content:center"><button class="btn" onclick="S.screen='login';S.authMsg='';render()">Back to sign in</button></div></div></div>`;
  if (S.screen === 'signup') return `<div class="login-wrap"><div class="login">${logo}<div class="muted">Create your account</div>
    <form class="fgrid" onsubmit="event.preventDefault();doSignUp(this.querySelector('button[type=submit]'))">
      <label class="f">Full name<input type="text" id="su_name" autocomplete="name"></label>
      <label class="f">Email<input type="email" id="su_email" autocomplete="email" required></label>
      <label class="f">Password (at least 8 characters)<input type="password" id="su_pw" autocomplete="new-password" required minlength="8"></label>
      <label class="f">Confirm password<input type="password" id="su_pw2" autocomplete="new-password" required></label>
      ${err}
      <button class="btn pri" type="submit">Create account</button>
      <div class="hint">Use the email address the Chair has on file for you. Committee members on the list get access right away; anyone else will wait for the Chair’s approval.</div>
      <button class="link" type="button" onclick="S.screen='login';S.authMsg='';render()">Already have an account? Sign in</button>
    </form></div></div>`;
  return `<div class="login-wrap"><div class="login">${logo}<div class="muted">Sign in to continue</div>
    <form class="fgrid" onsubmit="event.preventDefault();doSignIn(this.querySelector('button[type=submit]'))">
      <label class="f">Email<input type="email" id="li_email" autocomplete="username" required></label>
      <label class="f">Password<input type="password" id="li_pw" autocomplete="current-password" required></label>
      ${err}
      <button class="btn pri" type="submit">Sign in</button>
      <button class="link" type="button" onclick="S.screen='signup';S.authMsg='';render()">First time here? Create your account</button>
      <div class="hint">Forgot your password? Contact the Committee Chair for a temporary one.</div>
    </form></div></div>`;
}

function renderShell(){
  const tabs = [
    ...(!isViewer() ? [['review','Case Review']] : []),
    ...(isChair() ? [['tracker','Chair Tracker <span class="lock">🔒</span>']] : []),
    ['breview','Board Review'],
    ['board','Status Board']
  ];
  const pending = isChair() && S.users && S.users.users.some(u => u.status === 'pending');
  let body = '<div class="loading">Loading…</div>';
  if (S.tab === 'review' && S.review) body = renderReview();
  if (S.tab === 'tracker' && S.tracker) body = renderTracker();
  if (S.tab === 'breview' && S.breview) body = renderBoardReview();
  if (S.tab === 'board' && S.board) body = renderBoard();
  if (S.tab === 'users' && S.users) body = renderUsers();
  return `
  <header><div class="hdr">
    <img src="${ICON}" alt="">
    <div><h1>IDC Amicus Committee</h1><div class="sub">Illinois Defense Counsel</div></div>
    <div class="sp"></div>
    <div class="who">Signed in as <b>${esc(S.me.name)}</b><br>${esc(ROLE_LABEL[S.me.role])}</div>
    ${isChair() ? `<button class="hbtn" onclick="go('users')">Users${pending ? ' •' : ''}</button>` : ''}
    <button class="hbtn" onclick="changePasswordModal()">Password</button>
    <button class="hbtn" onclick="signOut()">Sign out</button>
  </div></header>
  <nav><div class="tabs">${tabs.map(([k,l]) => `<button class="tab ${S.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}</div></nav>
  <main>${body}</main>
  <footer>IDC Amicus Committee app v${APP_VERSION} · Build ${BUILD_DATE} · Questions or access problems? Contact the Committee Chair.</footer>`;
}

/* ============================================================
   TAB 1 — CASE REVIEW
   ============================================================ */
function reviewIndex(){
  const R = S.review, by = (arr, k) => arr.reduce((m, x) => ((m[x[k]] ||= []).push(x), m), {});
  return { votes: by(R.votes, 'case_id'), comments: by(R.comments, 'case_id'), docs: by(R.documents, 'case_id'),
           names: Object.fromEntries(R.members.map(m => [m.id, m.name])) };
}
function tallyOf(votes){ const t = {yes:0,no:0,abstain:0,recuse:0}; (votes||[]).forEach(v => t[v.vote]++); t.total = t.yes+t.no+t.abstain+t.recuse; return t; }
const lockedCase = c => c.vote_deadline && today() > c.vote_deadline;

function renderReview(){
  const R = S.review, ix = reviewIndex();
  return `<div class="bar"><h2>Case Review</h2><span class="hint">${R.cases.length} open for comment and vote · click a case to expand</span>
    <div class="sp"></div>${isChair() ? `<button class="btn pri" onclick="caseModal()">+ New Case</button>` : ''}</div>
    ${R.cases.length ? R.cases.map(c => caseCard(c, ix)).join('') : '<div class="empty">No cases are open for review right now.</div>'}
    ${renderArchive()}`;
}

function caseCard(c, ix){
  const votes = ix.votes[c.id] || [], t = tallyOf(votes), mine = (votes.find(v => v.member_id === S.me.id) || {}).vote;
  const comments = ix.comments[c.id] || [], open = S.open[c.id];
  const VL = {yes:'Yes', no:'No', abstain:'Abstain', recuse:'Recuse'};
  const dl = c.vote_deadline ? (lockedCase(c) ? `<span style="color:var(--no)">Voting closed ${fmtDate(c.vote_deadline)}</span>` : `Vote by ${fmtDate(c.vote_deadline)}`) : '';
  return `<div class="card ${open?'open':''}">
    <div class="chead" onclick="S.open['${c.id}']=!S.open['${c.id}'];render(true)">
      <svg class="chev" viewBox="0 0 20 20" fill="currentColor"><path d="M7 4l6 6-6 6"/></svg>
      <div>
        <div class="ctitle">${esc(c.case_name)}</div>
        <div class="cmeta"><span class="badge ${c.case_type==='request'?'req':''}">${c.case_type==='pla'?'PLA Granted':'Outside Request'}</span>
          ${c.court_no ? ' · No. ' + esc(c.court_no) : ''} · Posted ${fmtStamp(c.created_at).split(' ')[0]}</div>
      </div>
      <div class="cright">
        <div class="tally"><span class="pill">${t.total} vote${t.total===1?'':'s'}</span><span class="pill y">Yes ${t.yes}</span><span class="pill n">No ${t.no}</span>
          ${t.abstain?`<span class="pill a">Abstain ${t.abstain}</span>`:''}${t.recuse?`<span class="pill r">Recuse ${t.recuse}</span>`:''}</div>
        <span>Your vote: <span class="myvote">${mine ? VL[mine] : '—'}</span></span>
        <span>💬 ${comments.length}</span>
        ${dl ? `<span>${dl}</span>` : ''}
      </div>
    </div>
    ${open ? caseBody(c, votes, t, comments, ix) : ''}
  </div>`;
}

function caseBody(c, votes, t, comments, ix){
  const details = c.case_type === 'pla'
    ? `<dl class="kv"><dt>Supreme Court No.</dt><dd>${esc(c.court_no)||'—'}</dd><dt>Appellate citation</dt><dd>${esc(c.app_cite)||'—'}${c.district?' ('+esc(c.district)+')':''}</dd>
       <dt>PLA granted</dt><dd>${fmtDate(c.pla_granted)||'—'}</dd><dt>Appellant</dt><dd>${esc(c.appellant)||'—'}</dd><dt>Issue(s) presented</dt><dd>${esc(c.issues)||'—'}</dd></dl>
       <div class="sec" style="margin-top:14px"><h4>Summary</h4><div class="summary">${esc(c.summary)||'<span class="muted">No summary yet.</span>'}</div></div>`
    : `<dl class="kv"><dt>Court / case no.</dt><dd>${esc(c.court_no)||'—'}</dd><dt>Requested by</dt><dd>${esc(c.requester_name)||'—'}${c.requester_firm?', '+esc(c.requester_firm):''}</dd>
       <dt>Contact</dt><dd>${esc(c.requester_contact)||'—'}</dd><dt>Received</dt><dd>${fmtDate(c.date_received)||'—'}</dd></dl>
       <div class="sec" style="margin-top:14px"><h4>Facts / Notes</h4><div class="summary">${esc(c.facts_notes)||'<span class="muted">None yet.</span>'}</div></div>`;
  const docs = ix.docs[c.id] || [];
  const docHtml = `<div class="sec"><h4>Documents</h4>
    ${docs.length ? `<ul class="docs">${docs.map(d => `<li><span class="pdf">PDF</span><button class="doclink" onclick="openDoc('${d.id}')">${esc(d.file_name)}</button>
      ${isChair() ? `<button class="link x" style="color:var(--no)" onclick="removeDoc('${d.id}','${esc(d.file_name).replace(/'/g,'')}')">remove</button>` : ''}</li>`).join('')}</ul>` : '<div class="hint">No documents uploaded.</div>'}
    ${isChair() ? `<label class="btn sm" style="display:inline-block;margin-top:8px">+ Add PDF<input type="file" accept="application/pdf,.pdf" multiple hidden onchange="addDocs({case_id:'${c.id}'},this)"></label>` : ''}</div>`;

  const lk = lockedCase(c), mine = (votes.find(v => v.member_id === S.me.id) || {}).vote;
  const vb = (k,l,cl) => `<button class="vb ${cl} ${mine===k?'on':''}" ${lk?'disabled':''} onclick="castVote('${c.id}','${k}',this)">${l}</button>`;
  const voterMap = Object.fromEntries(votes.map(v => [v.member_id, v.vote]));
  const group = k => S.review.members.filter(m => voterMap[m.id] === k).map(m => esc(m.name)).join(', ') || '<span class="muted">—</span>';
  const notVoted = S.review.members.filter(m => !voterMap[m.id]).map(m => esc(m.name)).join(', ') || '<span class="muted">Everyone has voted</span>';
  const voteHtml = `<div class="sec"><h4>Your vote — should IDC participate as amicus?</h4>
    <div class="votebtns">${vb('yes','Yes','y')}${vb('no','No','n')}${vb('abstain','Abstain','a')}${vb('recuse','Recuse','r')}</div>
    <div class="hint" style="margin-bottom:8px">${lk ? 'Voting closed on the deadline.' : 'You can change your vote at any time' + (c.vote_deadline ? ' until the deadline' : '') + '.'}</div>
    <div class="voters">
      <div><span class="lbl" style="color:var(--yes)">Yes (${t.yes})</span>${group('yes')}</div>
      <div><span class="lbl" style="color:var(--no)">No (${t.no})</span>${group('no')}</div>
      <div><span class="lbl" style="color:var(--abs)">Abstain (${t.abstain})</span>${group('abstain')}</div>
      <div><span class="lbl" style="color:var(--rec)">Recuse (${t.recuse})</span>${group('recuse')}</div>
      <div><span class="lbl muted">Not voted</span>${notVoted}</div>
    </div></div>`;

  const all = S.showAll[c.id], N = comments.length, shown = all ? comments : comments.slice(-3);
  const commentHtml = `<div class="sec"><h4>Comments (${N})</h4>
    ${N > 3 ? `<button class="link" onclick="S.showAll['${c.id}']=${!all};render(true)">${all ? 'Show fewer' : `Show ${N-3} earlier comment${N-3===1?'':'s'}`}</button>` : ''}
    ${shown.map(m => commentRow(c, m, ix)).join('') || '<div class="hint">No comments yet.</div>'}
    <div class="addc"><textarea id="nc_${c.id}" placeholder="Add a comment… (if you are replying to someone, just say so)"></textarea>
      <button class="btn pri" onclick="addComment('${c.id}',this)">Post</button></div></div>`;

  const chair = isChair() ? `<div class="chairbar"><span class="lbl">Chair actions:</span>
    <button class="btn sm gold" onclick="approveModal('${c.id}')">✓ Approve for Amicus</button>
    <button class="btn sm danger" onclick="declineModal('${c.id}')">Decline &amp; Delete</button>
    <button class="btn sm" onclick="deadlineModal('${c.id}')">${c.vote_deadline ? 'Change' : 'Set'} deadline</button>
    <button class="btn sm" onclick="caseModal('${c.id}')">Edit case</button></div>` : '';
  return `<div class="cbody"><div>${details}${docHtml}</div><div>${voteHtml}${commentHtml}</div>${chair}</div>`;
}

function commentRow(c, m, ix){
  const mine = m.member_id === S.me.id, who = ix.names[m.member_id] || 'Former member';
  if (S.editing === m.id) return `<div class="comment"><div class="ch"><b>${esc(who)}</b></div>
    <textarea id="ed_${m.id}">${esc(m.body)}</textarea>
    <div style="display:flex;gap:6px;margin-top:6px"><button class="btn sm pri" onclick="saveComment('${m.id}',this)">Save</button><button class="btn sm" onclick="S.editing=null;render(true)">Cancel</button></div></div>`;
  return `<div class="comment"><div class="ch"><b>${esc(who)}</b><span class="when">${fmtStamp(m.created_at)}${m.edited_at ? ' · (edited)' : ''}</span>
    <span class="acts">${mine ? `<button class="link" onclick="S.editing='${m.id}';render(true)">Edit</button>` : ''}
    ${isChair() ? `<button class="link" style="color:var(--no)" onclick="deleteComment('${m.id}',this)">Delete</button>` : ''}</span></div>
    <div class="txt">${esc(m.body)}</div></div>`;
}

function renderArchive(){
  const A = S.review.archive;
  return `<div class="section-title">Archive — every case presented <span class="count">${A.length}</span></div>
  ${A.length ? `<div class="tbl-wrap"><table><thead><tr><th>Case</th><th>Court No.</th><th>Type</th><th>Presented</th><th>Final vote</th><th>Outcome</th></tr></thead><tbody>
  ${A.map(a => `<tr><td>${esc(a.case_name)}</td><td>${esc(a.court_no)}</td><td>${a.case_type==='pla'?'PLA':'Request'}</td><td>${fmtDate(a.presented_at)}</td>
    <td style="white-space:nowrap">${a.yes_count} Yes / ${a.no_count} No${a.abstain_count||a.recuse_count?` <span class="muted">(${a.abstain_count} abst., ${a.recuse_count} rec.)</span>`:''}</td>
    <td><span class="res ${a.outcome.startsWith('Approved')?'fav':'tbd'}">${esc(a.outcome)}</span></td></tr>`).join('')}
  </tbody></table></div>` : '<div class="empty">No cases have been decided yet.</div>'}`;
}

/* ---- Case Review actions ---- */
const reloadReview = async () => { S.review = await api('getReview'); render(true); };
function castVote(caseId, vote, btn){ run(async () => { await api('castVote', { case_id: caseId, vote }); await reloadReview(); }, btn); }
function addComment(caseId, btn){
  const el = $('#nc_' + caseId), body = el.value.trim(); if (!body) return;
  run(async () => { await api('addComment', { case_id: caseId, body }); el.value = ''; await reloadReview(); }, btn);
}
function saveComment(id, btn){ run(async () => { await api('editComment', { id, body: val('ed_' + id) }); S.editing = null; await reloadReview(); }, btn); }
function deleteComment(id, btn){ if (!confirm('Delete this comment?')) return; run(async () => { await api('deleteComment', { id }); await reloadReview(); toast('Comment deleted'); }, btn); }
function addDocs(target, input){ const files = [...input.files]; input.value = ''; run(async () => { await uploadMany(target, files); await reloadAfterDocChange(); }); }
function removeDoc(id, name){ if (!confirm(`Permanently delete ${name}?`)) return; run(async () => { await api('deleteDocument', { id }); await reloadAfterDocChange(); toast('Document deleted'); }); }
async function reloadAfterDocChange(){ if (S.tab === 'review') await reloadReview(); else if (S.tab === 'tracker') { S.tracker = await api('getTracker'); render(true); } else if (S.tab === 'board') { S.board = await api('getBoard'); render(true); } else if (S.tab === 'breview') { S.breview = await api('getBoardReview'); render(true); } }

const CASE_FIELDS = ['case_name','court_no','app_cite','district','pla_granted','appellant','vote_deadline','issues','summary','requester_name','requester_firm','requester_contact','date_received','facts_notes'];
function caseModal(id, typeOverride, carry){
  const c = id ? S.review.cases.find(x => x.id === id) : null;
  const v = carry || c || {};
  const type = typeOverride || (c ? c.case_type : 'pla');
  const pla = type === 'pla';
  const inp = (k, label, cls, t) => `<label class="f ${cls||''}">${label}<input type="${t||'text'}" id="cf_${k}" value="${esc(v[k]||'')}"></label>`;
  const area = (k, label, h) => `<label class="f full">${label}<textarea id="cf_${k}" style="min-height:${h||70}px">${esc(v[k]||'')}</textarea></label>`;
  const sel = (k, label, opts) => `<label class="f">${label}<select id="cf_${k}">${opts.map(o => `<option ${v[k]===o?'selected':''}>${o}</option>`).join('')}</select></label>`;
  openModal(`<h3>${c ? 'Edit Case' : 'New Case'}</h3>
    <div class="seg"><button class="${pla?'on':''}" onclick="caseModal(${id?`'${id}'`:'null'},'pla',collectCase())">PLA Granted</button><button class="${!pla?'on':''}" onclick="caseModal(${id?`'${id}'`:'null'},'request',collectCase())">Outside Request</button></div>
    <div class="fgrid">
      ${inp('case_name','Case name','full')}
      ${pla ? `${inp('court_no','Supreme Court No.')}${inp('pla_granted','Date PLA granted','', 'date')}
        ${inp('app_cite','Appellate citation')}${sel('district','District',['','First District','Second District','Third District','Fourth District','Fifth District'])}
        ${sel('appellant','Appellant',['','Defendant','Plaintiff','Other'])}${inp('vote_deadline','Voting deadline (optional)','','date')}
        ${area('issues','Issue(s) presented')}${area('summary','Summary',140)}`
      : `${inp('court_no','Court / case no. (optional)')}${inp('date_received','Date received','','date')}
        ${inp('requester_name','Requester name')}${inp('requester_firm','Requester firm')}
        ${inp('requester_contact','Requester contact (email / phone)')}${inp('vote_deadline','Voting deadline (optional)','','date')}
        ${area('facts_notes','Facts / Notes',140)}`}
      ${c ? '' : `<label class="f full">Documents (PDF, 25 MB max each)<input type="file" id="cf_files" accept="application/pdf,.pdf" multiple></label>`}
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn pri" onclick="saveCase(${id?`'${id}'`:'null'},'${type}',this)">${c ? 'Save changes' : 'Post to Committee'}</button></div>`);
}
function collectCase(){ const o = {}; CASE_FIELDS.forEach(k => { const el = document.getElementById('cf_' + k); if (el) o[k] = el.value; }); return o; }
function saveCase(id, type, btn){
  const fields = collectCase();
  if (!fields.case_name.trim()) return toast('Case name is required', true);
  const files = id ? [] : [...($('#cf_files') || {}).files || []];
  run(async () => {
    const payload = { case_type: type, ...fields };
    let c;
    if (id) c = (await api('updateCase', { id, ...payload })).case;
    else c = (await api('createCase', payload)).case;
    closeModal();
    if (files.length) await uploadMany({ case_id: c.id }, files);
    S.open[c.id] = true; await reloadReview(); toast(id ? 'Case updated' : 'Case posted to the committee');
  }, btn);
}
function deadlineModal(id){
  const c = S.review.cases.find(x => x.id === id);
  openModal(`<h3>Voting deadline</h3><label class="f">Deadline<input type="date" id="dl_v" value="${c.vote_deadline||''}"></label>
    <div class="hint" style="margin-top:6px">Voting locks after this date (Central time). Leave blank for no deadline.</div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveDeadline('${id}',this)">Save</button></div>`);
}
function saveDeadline(id, btn){ run(async () => { await api('updateCase', { id, vote_deadline: val('dl_v') }); closeModal(); await reloadReview(); }, btn); }
function approveModal(id){
  const c = S.review.cases.find(x => x.id === id), t = tallyOf(reviewIndex().votes[id]);
  openModal(`<h3>Approve for Amicus?</h3><div class="infobox"><b>${esc(c.case_name)}</b><br>Final tally: ${t.total} votes — ${t.yes} Yes, ${t.no} No, ${t.abstain} Abstain, ${t.recuse} Recuse.</div>
    <p>The case moves to your <b>Chair Tracker</b>, its documents are kept permanently, and the Archive records “Approved for amicus.” Voting and comments close.</p>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="doApprove('${id}',this)">Approve</button></div>`);
}
function doApprove(id, btn){
  const name = (S.review.cases.find(x => x.id === id) || {}).case_name || '';
  run(async () => {
    await api('approveCase', { id }); closeModal(); await reloadReview();
    toast('Moved to the Chair Tracker');
    boardReportModal(id, name);                 // next step: report to the Board
  }, btn);
}
function declineModal(id){
  const c = S.review.cases.find(x => x.id === id), ix = reviewIndex(), t = tallyOf(ix.votes[id]), docs = ix.docs[id] || [], n = (ix.comments[id] || []).length;
  openModal(`<h3>Decline &amp; Delete</h3>
    <div class="warnbox"><b>This cannot be undone.</b> The following will be permanently deleted:
      <ul style="margin:6px 0 0 18px;padding:0"><li>${docs.length} document(s)${docs.length?': '+docs.map(d=>esc(d.file_name)).join(', '):''}</li><li>${n} comment(s)</li><li>${t.total} vote(s)</li><li>The case summary / facts</li></ul></div>
    <p>An Archive entry is kept: <b>${esc(c.case_name)}</b> — ${t.yes} Yes / ${t.no} No — Outcome: <b>No IDC involvement</b>.</p>
    <label class="f">Type DELETE to confirm<input type="text" id="del_ok" autocomplete="off"></label>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doDecline('${id}',this)">Delete permanently</button></div>`);
}
function doDecline(id, btn){
  if (val('del_ok').trim().toUpperCase() !== 'DELETE') return toast('Type DELETE to confirm', true);
  run(async () => { await api('declineCase', { id, confirm: 'DELETE' }); closeModal(); await reloadReview(); toast('Case and documents deleted; archive entry saved'); }, btn);
}
</script>
<script>
/* ============================================================
   TAB 2 — CHAIR TRACKER
   ============================================================ */
function renderTracker(){
  const T = S.tracker;
  return `<div class="bar"><h2>Chair Tracker</h2><span class="hint">🔒 Visible only to you. Each step has a checkbox, date and notes — skip any you don’t need. Changes save automatically.</span></div>
    ${T.cases.length ? T.cases.map(trackerCard).join('') : '<div class="empty">No approved cases yet. Use “Approve for Amicus” on a case in Case Review.</div>'}`;
}
function trackerOf(caseId){ return S.tracker.trackers.find(t => t.case_id === caseId) || { steps: {} }; }
function stepOf(t, k){ return Object.assign({ done:false, date:'', notes:'' }, (t.steps || {})[k] || {}); }
function trackerCard(c){
  const t = trackerOf(c.id), open = S.open['t' + c.id] !== false;
  const done = STEPS.filter(s => stepOf(t, s.k).done).length;
  const due = stepOf(t, 'due').date, filed = stepOf(t, 'filed').done;
  let dueBadge = '';
  if (due && !filed) { const n = daysTo(due); dueBadge = `<span class="due ${n<0?'over':n<=14?'soon':'ok'}">Brief due ${fmtDate(due)}${n<0?' — OVERDUE':n<=14?` — ${n} day${n===1?'':'s'}`:''}</span>`; }
  const onBoard = S.tracker.board.find(b => b.case_id === c.id);
  const docs = S.tracker.documents.filter(d => d.case_id === c.id);
  return `<div class="card ${open?'open':''}">
    <div class="chead" onclick="S.open['t${c.id}']=!(S.open['t${c.id}']!==false);render(true)">
      <svg class="chev" viewBox="0 0 20 20" fill="currentColor"><path d="M7 4l6 6-6 6"/></svg>
      <div><div class="ctitle">${esc(c.case_name)}</div><div class="cmeta">${c.court_no?'No. '+esc(c.court_no)+' · ':''}Approved ${fmtStamp(c.approved_at).split(' ')[0]}${onBoard?' · <b>On Status Board</b>':''}</div></div>
      <div class="cright">${boardBadge(c)}${dueBadge}<div class="progress"><span style="width:${done/STEPS.length*100}%"></span></div><span>${done} of ${STEPS.length} steps</span></div>
    </div>
    ${open ? `<div style="padding:4px 16px 16px;border-top:1px solid var(--line)">
      <div class="chairbar" style="border-top:none;padding-top:10px"><span class="lbl">Board:</span>
        ${c.board_status === 'approved' ? '<span class="hint">The Board approved this case.</span>' : `<button class="btn sm gold" onclick="boardReportModal('${c.id}','${esc(c.case_name).replace(/'/g,'')}')">${reportOf(c.id) && reportOf(c.id).status === 'shared' ? 'Edit / re-share board report' : 'Board report'}</button>`}
        ${c.board_status === 'pending' ? `<button class="btn sm" onclick="go('breview')">Open Board Review →</button>` : ''}</div>
      ${STEPS.map(s => stepRow(c, t, s)).join('')}
      <label class="f" style="margin-top:12px">General notes<textarea id="tg_${c.id}" onchange="saveTrackerField('${c.id}','general_notes',this.value)">${esc(t.general_notes||'')}</textarea></label>
      <div class="sec" style="margin-top:16px"><h4>Case documents (kept permanently)</h4>
        ${docs.length ? `<ul class="docs">${docs.map(d => `<li><span class="pdf">PDF</span><button class="doclink" onclick="openDoc('${d.id}')">${esc(d.file_name)}</button><button class="link x" style="color:var(--no)" onclick="removeDoc('${d.id}','${esc(d.file_name).replace(/'/g,'')}')">remove</button></li>`).join('')}</ul>` : '<div class="hint">No documents.</div>'}
        <label class="btn sm" style="display:inline-block;margin-top:8px">+ Add PDF<input type="file" accept="application/pdf,.pdf" multiple hidden onchange="addDocs({case_id:'${c.id}'},this)"></label>
      </div></div>` : ''}
  </div>`;
}
function stepRow(c, t, s){
  const st = stepOf(t, s.k), id = c.id;
  let extra = '';
  if (s.k === 'authors') {
    const sel = st.member_ids || [];
    extra = `<div class="extra" style="grid-template-columns:1fr"><div><div class="hint" style="margin-bottom:4px">Authors with app accounts (they can add status updates on the Status Board):</div>
      <div class="authpick">${S.tracker.members.map(m => `<label><input type="checkbox" ${sel.includes(m.id)?'checked':''} onchange="toggleAuthor('${id}','${m.id}',this.checked)"> ${esc(m.name)}</label>`).join('')}</div></div>
      <label class="f">Outside co-authors (listed by name only)<input type="text" id="to_${id}" value="${esc(t.outside_authors||'')}" placeholder="e.g. Bruce Pfaff (ITLA)" onchange="saveTrackerField('${id}','outside_authors',this.value)"></label></div>`;
  }
  if (s.k === 'counsel') {
    extra = `<div class="extra">${[['counsel_name','Counsel name'],['counsel_firm','Firm'],['counsel_email','Email'],['counsel_phone','Phone']].map(([k,l]) =>
      `<label class="f">${l}<input type="text" id="tc_${k}_${id}" value="${esc(t[k]||'')}" onchange="saveTrackerField('${id}','${k}',this.value)"></label>`).join('')}</div>`;
  }
  return `<div class="step ${st.done?'done':''}">
    <input type="checkbox" ${st.done?'checked':''} onchange="saveStep('${id}','${s.k}',{done:this.checked})" aria-label="${s.n}">
    <div class="nm">${s.n}${s.s?`<small>${s.s}</small>`:''}</div>
    <input type="date" value="${esc(st.date)}" onchange="saveStep('${id}','${s.k}',{date:this.value})" aria-label="${s.n} date">
    <input type="text" id="tn_${s.k}_${id}" value="${esc(st.notes)}" placeholder="Notes" onchange="saveStep('${id}','${s.k}',{notes:this.value},true)">
    ${extra}
  </div>`;
}
async function applyTrackerResult(r, quiet){
  const i = S.tracker.trackers.findIndex(t => t.case_id === r.tracker.case_id);
  if (i >= 0) S.tracker.trackers[i] = r.tracker; else S.tracker.trackers.push(r.tracker);
  if (r.board && !S.tracker.board.find(b => b.id === r.board.id)) { S.tracker.board.push(r.board); toast('Added to the Status Board as a Current case'); }
  else if (!quiet) toast('Saved');
  if (!quiet) render(true);
}
function saveStep(caseId, k, change, quiet){
  const t = trackerOf(caseId), st = Object.assign(stepOf(t, k), change);
  if (change.done && !st.date) st.date = today();
  run(async () => applyTrackerResult(await api('updateTracker', { case_id: caseId, steps: { [k]: st } }), quiet && !change.done));
}
function toggleAuthor(caseId, memberId, on){
  const st = stepOf(trackerOf(caseId), 'authors'), ids = new Set(st.member_ids || []);
  on ? ids.add(memberId) : ids.delete(memberId);
  saveStep(caseId, 'authors', { member_ids: [...ids] });
}
function saveTrackerField(caseId, field, value){ run(async () => applyTrackerResult(await api('updateTracker', { case_id: caseId, [field]: value }), true)); }

/* ============================================================
   TAB 3 — STATUS BOARD
   ============================================================ */
function boardIndex(){
  const B = S.board;
  return { names: Object.fromEntries(B.members.map(m => [m.id, m.name])),
    updates: id => B.updates.filter(u => u.board_id === id),
    authorIds: id => B.authors.filter(a => a.board_id === id).map(a => a.member_id),
    opinion: id => B.opinions.find(o => o.board_id === id) };
}
const canEditBoard = (ix, b) => isChair() || ix.authorIds(b.id).includes(S.me.id);
// Case PDFs that moved with an approved case onto the Status Board
function caseDocLinks(b){
  const docs = b.case_id ? (S.board.caseDocs || []).filter(d => d.case_id === b.case_id) : [];
  return docs.length ? `<div style="margin-top:4px">${docs.map(d => `<div style="font-size:12.5px"><span class="pdf">PDF</span> <button class="doclink" style="font-size:12.5px" onclick="openDoc('${d.id}')">${esc(d.file_name)}</button></div>`).join('')}</div>` : '';
}
function resClass(r){ r = (r||'').toLowerCase(); if (r.startsWith('unfav')) return 'unf'; if (r.startsWith('fav')) return 'fav'; if (r.startsWith('mixed')) return 'mix'; if (r.startsWith('issue')) return 'nr'; return 'tbd'; }
const dash = '<span class="muted">—</span>';
const clamp = txt => txt ? `<div class="clamp" onclick="this.classList.toggle('open')">${esc(txt)}</div>` : dash;

function renderBoard(){
  const B = S.board, ix = boardIndex(), cur = B.board.filter(b => !b.decided), dec = B.board.filter(b => b.decided);
  const cols = isChair() ? 7 : 6;
  return `<div class="bar"><h2>Status Board</h2><span class="hint">Click any long text to expand it.</span><div class="sp"></div>
    ${isChair() ? `<button class="btn" onclick="boardModal()">+ Add case to board</button>` : ''}</div>
  <div class="section-title">Current Cases <span class="count">${cur.length}</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Case Name</th><th>Court #</th><th>Author(s)</th><th>Date Filed</th><th>Synopsis of Argument</th><th style="min-width:240px">Status</th>${isChair()?'<th></th>':''}</tr></thead><tbody>
  ${cur.map(b => {
    const ups = ix.updates(b.id), last = ups[ups.length-1], h = S.hist[b.id], ed = canEditBoard(ix, b);
    const who = u => esc(u.author_label || ix.names[u.member_id] || '');
    return `<tr><td><b>${esc(b.case_name)}</b>${caseDocLinks(b)}</td><td class="w-court">${esc(b.court_no)||dash}</td><td class="w-auth">${esc(b.authors_text)||dash}</td>
      <td class="w-date">${esc(b.date_filed)||dash}</td><td>${clamp(b.synopsis)}</td>
      <td><div class="status-latest">${last?`<span class="d">${fmtDate(last.entry_date)}</span> ${esc(last.note)}`:'<span class="muted">No updates yet</span>'}</div>
        <button class="link" onclick="S.hist['${b.id}']=!S.hist['${b.id}'];render(true)">${h?'Hide':'History'} (${ups.length})${ed?' · Add update':''}</button></td>
      ${isChair()?`<td style="white-space:nowrap"><button class="btn sm" onclick="boardModal('${b.id}')">Edit</button> <button class="btn sm" onclick="decideModal('${b.id}')">Mark Decided</button></td>`:''}</tr>
      ${h ? `<tr class="hist"><td colspan="${cols}"><ul>${[...ups].reverse().map(u => `<li><span class="d">${fmtDate(u.entry_date)} · ${who(u)}</span>${esc(u.note)}</li>`).join('') || '<li class="muted">No updates yet.</li>'}</ul>
        ${ed ? `<div class="addc"><input type="text" id="su_${b.id}" placeholder="New status update…" onkeydown="if(event.key==='Enter')addStatus('${b.id}',this.nextElementSibling)"><button class="btn sm pri" onclick="addStatus('${b.id}',this)">Add</button></div>` : '<div class="hint" style="margin-top:6px">Only the Chair and the assigned author(s) can add updates.</div>'}</td></tr>` : ''}`;
  }).join('') || `<tr><td colspan="${cols}" class="muted">No current cases.</td></tr>`}
  </tbody></table></div>

  <div class="section-title">Decided Cases <span class="count">${dec.length}</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Case Name</th><th>Court #</th><th>Author(s)</th><th>Date Filed</th><th>Result</th><th>Synopsis of Argument</th><th>Outcome Analysis</th><th>Opinion</th>${isChair()?'<th></th>':''}</tr></thead><tbody>
  ${dec.map(b => { const op = ix.opinion(b.id);
    return `<tr><td><b>${esc(b.case_name)}</b>${b.decision_date||b.decision_cite?`<div class="cmeta">${b.decision_cite?esc(b.decision_cite):''}${b.decision_cite&&b.decision_date?' · ':''}${b.decision_date?'Decided '+fmtDate(b.decision_date):''}</div>`:''}${caseDocLinks(b)}</td>
    <td class="w-court">${esc(b.court_no)||dash}</td><td class="w-auth">${esc(b.authors_text)||dash}</td><td class="w-date">${esc(b.date_filed)||dash}</td>
    <td>${b.result?`<span class="res ${resClass(b.result)}">${esc(b.result)}</span>`:'<span class="res tbd">Details to be added</span>'}</td>
    <td>${clamp(b.synopsis)}</td><td>${clamp(b.outcome_analysis)}</td>
    <td style="white-space:nowrap">${op?`<span class="pdf">PDF</span> <button class="doclink" onclick="openDoc('${op.id}')">${esc(op.file_name)}</button>${isChair()?` <button class="link" style="color:var(--no)" onclick="removeDoc('${op.id}','${esc(op.file_name).replace(/'/g,'')}')">remove</button>`:''}`:
      (isChair()?`<label class="btn sm">Upload<input type="file" accept="application/pdf,.pdf" hidden onchange="addDocs({board_id:'${b.id}'},this)"></label>`:dash)}</td>
    ${isChair()?`<td><button class="btn sm" onclick="boardModal('${b.id}')">Edit</button></td>`:''}</tr>`; }).join('') || `<tr><td colspan="${isChair()?9:8}" class="muted">No decided cases yet.</td></tr>`}
  </tbody></table></div>`;
}

function addStatus(boardId, btn){
  const el = $('#su_' + boardId), note = el.value.trim(); if (!note) return;
  run(async () => { await api('addStatusUpdate', { board_id: boardId, note }); el.value = ''; S.board = await api('getBoard'); render(true); toast('Status updated'); }, btn);
}
const BOARD_FIELDS = ['case_name','court_no','authors_text','date_filed','synopsis','result','decision_cite','decision_date','outcome_analysis'];
async function boardModal(id){
  const b = id ? S.board.board.find(x => x.id === id) : { decided: false };
  if (!S.users) { try { S.users = await api('listUsers'); } catch(e){ return toast(e.message, true); } }
  const authorIds = id ? boardIndex().authorIds(id) : [];
  const accounts = S.users.users.filter(u => u.role !== 'viewer' && u.status !== 'pending');
  const inp = (k, l, cls, t) => `<label class="f ${cls||''}">${l}<input type="${t||'text'}" id="bf_${k}" value="${esc(b[k]||'')}"></label>`;
  const area = (k, l) => `<label class="f full">${l}<textarea id="bf_${k}" style="min-height:90px">${esc(b[k]||'')}</textarea></label>`;
  openModal(`<h3>${id ? 'Edit Status Board entry' : 'Add case to Status Board'}</h3>
    <div class="fgrid">
      ${inp('case_name','Case name','full')}${inp('court_no','Court #')}${inp('date_filed','Date filed (e.g. 05/18/2026 or “Not specified”)')}
      ${inp('authors_text','Author(s) as displayed','full')}
      <div class="full"><div class="hint" style="margin-bottom:4px">Author accounts — these people can add status updates:</div>
        <div class="authpick">${accounts.map(u => `<label><input type="checkbox" class="bf_auth" value="${u.id}" ${authorIds.includes(u.id)?'checked':''}> ${esc(u.name)}</label>`).join('')}</div></div>
      ${area('synopsis','Synopsis of Argument')}
      ${!id ? `<label class="f full"><input type="checkbox" id="bf_decided" onchange="document.getElementById('bf_dec_fields').style.display=this.checked?'contents':'none'"> Already decided</label>` : ''}
      <div id="bf_dec_fields" style="display:${b.decided?'contents':'none'}">
        <label class="f">Result<select id="bf_result"><option value=""></option>${RESULTS.map(r => `<option ${b.result===r?'selected':''}>${r}</option>`).join('')}${b.result && !RESULTS.includes(b.result) ? `<option selected>${esc(b.result)}</option>` : ''}</select></label>
        ${inp('decision_date','Decision date','','date')}${inp('decision_cite','Decision citation','full')}${area('outcome_analysis','Outcome Analysis')}
      </div>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveBoard(${id?`'${id}'`:'null'},this)">Save</button></div>`);
}
function saveBoard(id, btn){
  const p = {}; BOARD_FIELDS.forEach(k => { const el = document.getElementById('bf_' + k); if (el) p[k] = el.value; });
  if (!p.case_name.trim()) return toast('Case name is required', true);
  const authors = [...document.querySelectorAll('.bf_auth:checked')].map(x => x.value);
  run(async () => {
    let b;
    if (id) b = (await api('updateBoard', { id, ...p })).board;
    else b = (await api('createBoardEntry', { ...p, decided: !!($('#bf_decided') || {}).checked })).board;
    await api('setBoardAuthors', { board_id: b.id, member_ids: authors });
    closeModal(); S.board = await api('getBoard'); render(true); toast('Saved');
  }, btn);
}
function decideModal(id){
  const b = S.board.board.find(x => x.id === id);
  openModal(`<h3>Mark as Decided</h3><div class="hint" style="margin-bottom:12px"><b>${esc(b.case_name)}</b> moves to Decided Cases. Existing columns carry over; add the rest below.</div>
    <div class="fgrid">
      <label class="f">Result<select id="dm_result">${RESULTS.map(r => `<option>${r}</option>`).join('')}</select></label>
      <label class="f">Decision date<input type="date" id="dm_decision_date"></label>
      <label class="f full">Decision citation<input type="text" id="dm_decision_cite" placeholder="2026 IL 131000"></label>
      <label class="f full">Synopsis of Argument<textarea id="dm_synopsis">${esc(b.synopsis||'')}</textarea></label>
      <label class="f full">Outcome Analysis<textarea id="dm_outcome_analysis" style="min-height:110px"></textarea></label>
      <label class="f full">Opinion (PDF)<input type="file" id="dm_pdf" accept="application/pdf,.pdf"></label>
    </div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doDecide('${id}',this)">Move to Decided</button></div>`);
}
function doDecide(id, btn){
  const p = {}; ['result','decision_date','decision_cite','synopsis','outcome_analysis'].forEach(k => p[k] = val('dm_' + k));
  const file = ($('#dm_pdf').files || [])[0];
  run(async () => {
    await api('markDecided', { id, ...p });
    closeModal();
    if (file) await uploadMany({ board_id: id }, [file]);
    S.board = await api('getBoard'); render(true); toast('Moved to Decided Cases');
  }, btn);
}

/* ============================================================
   BOARD REVIEW (v1.1.0)
   Committee approves → Chair drafts/edits the report (Claude) → Share with Board
   → Board reads report + PDFs, votes & comments here → Chair records the decision.
   ============================================================ */
const APP_LINK = () => location.origin + location.pathname;
function reportOf(caseId){ return S.tracker && (S.tracker.reports || []).find(r => r.case_id === caseId); }
function boardBadge(c){
  if (c.board_status === 'approved') return '<span class="badge" style="background:var(--yes-bg);color:var(--yes)">Board approved</span>';
  if (c.board_status === 'pending')  return '<span class="badge req">With the Board</span>';
  const r = reportOf(c.id); return r ? '<span class="badge">Report draft saved</span>' : '<span class="badge">Board report not sent</span>';
}

function boardReportModal(caseId, name, presetText, presetTiming){
  const r = reportOf(caseId) || (S.breview && (S.breview.reports || []).find(x => x.case_id === caseId)) || {};
  const text = presetText !== undefined ? presetText : (r.report_text || '');
  const timing = presetTiming !== undefined ? presetTiming : (r.timing_notes || '');
  S.reportCaseName = name;                     // used for the email subject after sharing
  openModal(`<h3>Report to the Board</h3><div class="hint" style="margin-bottom:10px"><b>${esc(name)}</b></div>
    <label class="f">Timing / deadline notes for the Board (optional)<textarea id="br_timing" style="min-height:50px" placeholder="e.g. Appellant's brief due Dec. 1; amicus motion due 21 days later">${esc(timing)}</textarea></label>
    <div class="hint" style="margin:6px 0 12px">The draft uses the case summary, the committee vote, all comments (without names), the brief due date and author(s) from your Tracker, and these notes.</div>
    <button class="btn gold" onclick="draftReport('${caseId}',this)">${text ? '↻ Redraft with AI' : '✎ Draft with AI'}</button>
    <label class="f" style="margin-top:12px">Report (edit freely — nothing goes to the Board until you click Share)<textarea id="br_text" style="min-height:300px">${esc(text)}</textarea></label>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Close</button>
      <button class="btn" onclick="saveReport('${caseId}',false,this)">Save draft</button>
      <button class="btn pri" onclick="saveReport('${caseId}',true,this)">Share with Board</button></div>`);
}
function draftReport(caseId, btn){
  if (val('br_text').trim() && !confirm('Replace the current text with a new AI draft?')) return;
  const old = btn.textContent; btn.textContent = 'Drafting… (about 15 seconds)';
  run(async () => {
    const r = await api('draftBoardReport', { case_id: caseId, timing_notes: val('br_timing') });
    $('#br_text').value = r.draft; toast('Draft ready — please review and edit');
  }, btn).finally(() => { if (document.body.contains(btn)) btn.textContent = '↻ Redraft with AI'; });
}
function saveReport(caseId, share, btn){
  const text = val('br_text').trim(); if (!text) return toast('The report is empty — draft or type it first', true);
  if (share && !confirm('Share this report with the Board? It will appear on the Board Review tab with the case documents.')) return;
  run(async () => {
    const r = await api('saveBoardReport', { case_id: caseId, report_text: text, timing_notes: val('br_timing'), share });
    if (S.tracker) S.tracker = await api('getTracker');
    if (!share) { toast('Draft saved'); render(true); return; }
    closeModal(); render(true); sharedModal(caseId, text, r.recipients || []);
  }, btn);
}
function sharedModal(caseId, text, recipients){
  const name = S.reportCaseName || ((S.tracker && S.tracker.cases.find(c => c.id === caseId)) || {}).case_name || 'this case';
  const subject = `IDC Amicus — Board review requested: ${name}`;
  let bodyText = `The Amicus Committee recommends that IDC participate as amicus curiae in ${name}.\n\nThe committee's report and the case documents are in the IDC Amicus app under the "Board Review" tab, where Board members can vote and comment:\n${APP_LINK()}\n\n`;
  bodyText += (bodyText.length + text.length < 1700) ? text : '(The full report is in the app.)';
  const mailto = `mailto:?bcc=${encodeURIComponent(recipients.join(','))}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(bodyText)}`;
  window._sharedReport = text;
  openModal(`<h3>Shared with the Board ✓</h3>
    <p>The report and case documents are now on the <b>Board Review</b> tab, and “Report to Board” is checked in your Tracker.</p>
    <p>Next, let the Board know (${recipients.length} Board member${recipients.length===1?'':'s'} will be BCC’d):</p>
    <div class="mfoot" style="justify-content:flex-start">
      <a class="btn pri" href="${esc(mailto)}" style="text-decoration:none">✉ Open email to the Board</a>
      <button class="btn" onclick="copyReport()">Copy full report</button>
      <button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(${esc(JSON.stringify(recipients.join('; ')))}).then(()=>toast('Board emails copied'))">Copy Board emails</button></div>
    <div class="mfoot"><button class="btn" onclick="closeModal();go('breview')">Done — go to Board Review</button></div>`);
}
function copyReport(){ if (navigator.clipboard) navigator.clipboard.writeText(window._sharedReport || '').then(() => toast('Report copied')); }

function renderBoardReview(){
  const B = S.breview, pend = B.cases.filter(c => c.board_status === 'pending'), done = B.cases.filter(c => c.board_status === 'approved');
  const intro = S.me.on_board ? 'Read the committee’s report and documents, then vote and comment.'
    : (isChair() ? 'Board members vote and comment here. Record the Board’s decision when it is made (for example, after a board meeting).' : 'Board members vote and comment here.');
  return `<div class="bar"><h2>Board Review</h2><span class="hint">${intro}</span></div>
    ${pend.length ? pend.map(boardCard).join('') : '<div class="empty">No cases are waiting for the Board right now.</div>'}
    ${done.length ? `<div class="section-title">Approved by the Board <span class="count">${done.length}</span></div>${done.map(boardCard).join('')}` : ''}`;
}
function boardCard(c){
  const B = S.breview, rep = B.reports.find(r => r.case_id === c.id) || {}, pending = c.board_status === 'pending';
  const votes = B.votes.filter(v => v.case_id === c.id), t = tallyOf(votes), mine = (votes.find(v => v.member_id === S.me.id) || {}).vote;
  const comments = B.comments.filter(m => m.case_id === c.id), docs = B.documents.filter(d => d.case_id === c.id);
  const key = 'b' + c.id, open = S.open[key], VL = {yes:'Yes', no:'No', abstain:'Abstain', recuse:'Recuse'};
  const committee = `${rep.yes_count||0} Yes / ${rep.no_count||0} No${(rep.abstain_count||rep.recuse_count)?` (${rep.abstain_count||0} abst., ${rep.recuse_count||0} rec.)`:''}`;
  return `<div class="card ${open?'open':''}">
    <div class="chead" onclick="S.open['${key}']=!S.open['${key}'];render(true)">
      <svg class="chev" viewBox="0 0 20 20" fill="currentColor"><path d="M7 4l6 6-6 6"/></svg>
      <div><div class="ctitle">${esc(c.case_name)}</div>
        <div class="cmeta">${pending ? '<span class="badge req">Awaiting Board decision</span>' : '<span class="badge" style="background:var(--yes-bg);color:var(--yes)">Board approved</span>'}
          ${rep.shared_at ? ' · Sent to Board ' + fmtStamp(rep.shared_at).split(' ')[0] : ''} · Committee vote: ${committee}</div></div>
      <div class="cright">
        <div class="tally"><span class="pill">Board: ${t.total} vote${t.total===1?'':'s'}</span><span class="pill y">Yes ${t.yes}</span><span class="pill n">No ${t.no}</span>
          ${t.abstain?`<span class="pill a">Abstain ${t.abstain}</span>`:''}${t.recuse?`<span class="pill r">Recuse ${t.recuse}</span>`:''}</div>
        ${S.me.on_board ? `<span>Your vote: <span class="myvote">${mine ? VL[mine] : '—'}</span></span>` : ''}
        <span>💬 ${comments.length}</span>
      </div>
    </div>
    ${open ? boardBody(c, rep, votes, t, comments, docs, pending, mine) : ''}
  </div>`;
}
function boardBody(c, rep, votes, t, comments, docs, pending, mine){
  const B = S.breview, names = Object.fromEntries(B.members.map(m => [m.id, m.name]));
  const boardMembers = B.members.filter(m => m.on_board && m.active);
  const vm = Object.fromEntries(votes.map(v => [v.member_id, v.vote]));
  const group = k => boardMembers.filter(m => vm[m.id] === k).map(m => esc(m.name)).join(', ') || '<span class="muted">—</span>';
  const notVoted = boardMembers.filter(m => !vm[m.id]).map(m => esc(m.name)).join(', ') || '<span class="muted">Everyone has voted</span>';
  const canVote = S.me.on_board && pending, canComment = (S.me.on_board || isChair()) && pending;
  const vb = (k,l,cl) => `<button class="vb ${cl} ${mine===k?'on':''}" onclick="castBoardVote('${c.id}','${k}',this)">${l}</button>`;
  const left = `<div class="sec"><h4>Committee report to the Board</h4><div class="summary">${esc(rep.report_text) || '<span class="muted">No report text.</span>'}</div></div>
    <div class="sec"><h4>Documents</h4>${docs.length ? `<ul class="docs">${docs.map(d => `<li><span class="pdf">PDF</span><button class="doclink" onclick="openDoc('${d.id}')">${esc(d.file_name)}</button></li>`).join('')}</ul>` : '<div class="hint">No documents.</div>'}</div>`;
  const voteHtml = `<div class="sec"><h4>Board vote — should IDC participate as amicus?</h4>
    ${canVote ? `<div class="votebtns">${vb('yes','Yes','y')}${vb('no','No','n')}${vb('abstain','Abstain','a')}${vb('recuse','Recuse','r')}</div><div class="hint" style="margin-bottom:8px">You can change your vote until the Chair records the Board’s decision.</div>`
      : `<div class="hint" style="margin-bottom:8px">${pending ? (S.me.on_board ? '' : 'Only Board members vote here.') : 'Board voting is closed.'}</div>`}
    <div class="voters">
      <div><span class="lbl" style="color:var(--yes)">Yes (${t.yes})</span>${group('yes')}</div>
      <div><span class="lbl" style="color:var(--no)">No (${t.no})</span>${group('no')}</div>
      <div><span class="lbl" style="color:var(--abs)">Abstain (${t.abstain})</span>${group('abstain')}</div>
      <div><span class="lbl" style="color:var(--rec)">Recuse (${t.recuse})</span>${group('recuse')}</div>
      ${pending ? `<div><span class="lbl muted">Not voted</span>${notVoted}</div>` : ''}
    </div></div>`;
  const key = 'b' + c.id, all = S.showAll[key], N = comments.length, shown = all ? comments : comments.slice(-3);
  const row = m => {
    const own = m.member_id === S.me.id, who = names[m.member_id] || 'Former member';
    if (S.editing === m.id) return `<div class="comment"><div class="ch"><b>${esc(who)}</b></div><textarea id="bed_${m.id}">${esc(m.body)}</textarea>
      <div style="display:flex;gap:6px;margin-top:6px"><button class="btn sm pri" onclick="saveBoardComment('${m.id}',this)">Save</button><button class="btn sm" onclick="S.editing=null;render(true)">Cancel</button></div></div>`;
    return `<div class="comment"><div class="ch"><b>${esc(who)}</b><span class="when">${fmtStamp(m.created_at)}${m.edited_at ? ' · (edited)' : ''}</span>
      <span class="acts">${own && pending ? `<button class="link" onclick="S.editing='${m.id}';render(true)">Edit</button>` : ''}
      ${isChair() ? `<button class="link" style="color:var(--no)" onclick="deleteBoardComment('${m.id}',this)">Delete</button>` : ''}</span></div><div class="txt">${esc(m.body)}</div></div>`;
  };
  const commentHtml = `<div class="sec"><h4>Board comments (${N})</h4>
    ${N > 3 ? `<button class="link" onclick="S.showAll['${key}']=${!all};render(true)">${all ? 'Show fewer' : `Show ${N-3} earlier comment${N-3===1?'':'s'}`}</button>` : ''}
    ${shown.map(row).join('') || '<div class="hint">No comments yet.</div>'}
    ${canComment ? `<div class="addc"><textarea id="bc_${c.id}" placeholder="Add a comment for the Board…"></textarea><button class="btn pri" onclick="addBoardComment('${c.id}',this)">Post</button></div>` : ''}</div>`;
  const chair = isChair() && pending ? `<div class="chairbar"><span class="lbl">Chair — record the Board’s decision:</span>
    <button class="btn sm gold" onclick="boardApproveModal('${c.id}')">✓ Board Approved</button>
    <button class="btn sm danger" onclick="boardDeclineModal('${c.id}')">Board Declined</button>
    <button class="btn sm" onclick="boardReportModal('${c.id}','${esc(c.case_name).replace(/'/g,'')}')">Edit report</button></div>` : '';
  return `<div class="cbody"><div>${left}</div><div>${voteHtml}${commentHtml}</div>${chair}</div>`;
}
const reloadBoardReview = async () => { S.breview = await api('getBoardReview'); render(true); };
function castBoardVote(caseId, vote, btn){ run(async () => { await api('castBoardVote', { case_id: caseId, vote }); await reloadBoardReview(); }, btn); }
function addBoardComment(caseId, btn){
  const el = $('#bc_' + caseId), body = el.value.trim(); if (!body) return;
  run(async () => { await api('addBoardComment', { case_id: caseId, body }); el.value = ''; await reloadBoardReview(); }, btn);
}
function saveBoardComment(id, btn){ run(async () => { await api('editBoardComment', { id, body: val('bed_' + id) }); S.editing = null; await reloadBoardReview(); }, btn); }
function deleteBoardComment(id, btn){ if (!confirm('Delete this comment?')) return; run(async () => { await api('deleteBoardComment', { id }); await reloadBoardReview(); toast('Comment deleted'); }, btn); }
function boardApproveModal(caseId){
  const c = S.breview.cases.find(x => x.id === caseId), t = tallyOf(S.breview.votes.filter(v => v.case_id === caseId));
  openModal(`<h3>Record: Board Approved</h3><div class="infobox"><b>${esc(c.case_name)}</b><br>Board votes in the app: ${t.total} — ${t.yes} Yes, ${t.no} No, ${t.abstain} Abstain, ${t.recuse} Recuse.</div>
    <p>The case moves to the <b>Status Board</b> as a Current case with its documents, “Board Approval” is checked in your Tracker, and Board voting closes.</p>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn gold" onclick="doBoardDecision('${caseId}','approved',this)">Board Approved</button></div>`);
}
function boardDeclineModal(caseId){
  const c = S.breview.cases.find(x => x.id === caseId), docs = S.breview.documents.filter(d => d.case_id === caseId);
  openModal(`<h3>Record: Board Declined</h3>
    <div class="warnbox"><b>This cannot be undone.</b> The case, its report, Board votes and comments, your Tracker entry and ${docs.length} document(s) will be permanently deleted.</div>
    <p>The Archive keeps a record of <b>${esc(c.case_name)}</b> with outcome <b>Board declined</b>.</p>
    <label class="f">Type DELETE to confirm<input type="text" id="bdel_ok" autocomplete="off"></label>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doBoardDecision('${caseId}','declined',this)">Delete permanently</button></div>`);
}
function doBoardDecision(caseId, decision, btn){
  const confirmText = decision === 'declined' ? val('bdel_ok').trim().toUpperCase() : '';
  if (decision === 'declined' && confirmText !== 'DELETE') return toast('Type DELETE to confirm', true);
  run(async () => {
    await api('boardDecision', { case_id: caseId, decision, confirm: confirmText });
    closeModal(); await reloadBoardReview();
    toast(decision === 'approved' ? 'Board approval recorded — case added to the Status Board' : 'Recorded as Board declined; case and documents deleted');
  }, btn);
}

/* ============================================================
   USERS (Chair) + PASSWORD
   ============================================================ */
const roleSelect = (id, role, onch, disabled) => `<select style="width:auto" id="role_${id}" ${disabled?'disabled':''} ${onch?`onchange="${onch}"`:''}>
  ${['chair','member','viewer'].map(r => `<option value="${r}" ${role===r?'selected':''}>${ROLE_LABEL[r]}</option>`).join('')}</select>`;
function renderUsers(){
  const U = S.users.users, pend = U.filter(u => u.status === 'pending'), rest = U.filter(u => u.status !== 'pending');
  return `<div class="bar"><h2>Users</h2><span class="hint">🔒 Chair only</span><div class="sp"></div><button class="btn" onclick="go('review')">← Back</button></div>
  <div class="infobox"><b>Roles:</b> <b>Chair</b> — everything. <b>Member</b> — Case Review (comment &amp; vote), Board Review (read) and Status Board. <b>Viewer</b> — Board Review and Status Board only. <b>On Board</b> (checkbox, separate from role) — can vote and comment on the Board Review tab.</div>
  ${pend.length ? `<div class="section-title">Pending approval <span class="count">${pend.length}</span></div>
  <div class="hint" style="margin-bottom:8px">These people signed up from the link but were not on your list. Choose a role, then approve — or deny.</div>
  <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Signed up</th><th>Role</th><th></th></tr></thead><tbody>
  ${pend.map(u => `<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${fmtStamp(u.created_at).split(' ')[0]}</td><td>${roleSelect(u.id, 'member')}</td>
    <td style="white-space:nowrap"><button class="btn sm pri" onclick="approveUser('${u.id}',this)">Approve</button> <button class="btn sm danger" onclick="denyUser('${u.id}',this)">Deny</button></td></tr>`).join('')}
  </tbody></table></div>` : ''}
  <div class="section-title">Users <span class="count">${rest.length}</span></div>
  <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>On Board</th><th>Status</th><th></th></tr></thead><tbody>
  ${rest.map(u => { const self = u.id === S.me.id;
    return `<tr><td>${esc(u.name)} <button class="link" onclick="editNameModal('${u.id}')">edit</button></td><td>${esc(u.email)}</td><td>${roleSelect(u.id, u.role, `setRole('${u.id}',this)`, self)}</td>
    <td style="text-align:center"><input type="checkbox" ${u.on_board?'checked':''} onchange="setOnBoard('${u.id}',this)" aria-label="On Board"></td><td>${STATUS_LABEL[u.status]||esc(u.status)}</td>
    <td style="white-space:nowrap">${self ? '<span class="hint">You</span>' : `${u.has_login && u.status==='active' ? `<button class="btn sm" onclick="resetPw('${u.id}',this)">Reset password</button> ` : ''}
      <button class="btn sm" onclick="setStatus('${u.id}','${u.status==='inactive'?'active':'inactive'}',this)">${u.status==='inactive'?'Reactivate':'Deactivate'}</button>`}</td></tr>`; }).join('')}
  </tbody></table></div>
  <div class="section-title">Add a user to the approved list</div>
  <div class="card" style="padding:14px 16px"><div class="fgrid" style="grid-template-columns:1fr 1fr auto auto;align-items:end">
    <label class="f">Name<input type="text" id="am_n"></label><label class="f">Email<input type="email" id="am_e"></label>
    <label class="f">Role ${roleSelect('new', 'member')}</label>
    <button class="btn pri" onclick="addUser(this)">Add</button></div>
    <div class="hint" style="margin-top:8px">Then send them the app link. When they create an account with this email, they set a password and are in. Anyone not on the list lands in “Pending approval.”</div></div>`;
}
const reloadUsers = async () => { S.users = await api('listUsers'); render(true); };
function approveUser(id, btn){ run(async () => { await api('approveUser', { id, role: val('role_' + id) }); await reloadUsers(); toast('Approved'); }, btn); }
function denyUser(id, btn){ if (!confirm('Deny this request and remove the account?')) return; run(async () => { await api('denyUser', { id }); await reloadUsers(); }, btn); }
function setRole(id, sel){ run(async () => { await api('setRole', { id, role: sel.value }); await reloadUsers(); toast('Role updated'); }, sel); }
function setStatus(id, status, btn){ run(async () => { await api('setStatus', { id, status }); await reloadUsers(); }, btn); }
function setOnBoard(id, box){ run(async () => { await api('updateUser', { id, on_board: box.checked }); await reloadUsers(); toast(box.checked ? 'Marked as a Board member' : 'Removed from the Board'); }, box); }
function editNameModal(id){
  const u = S.users.users.find(x => x.id === id);
  openModal(`<h3>Edit name</h3><label class="f">Name<input type="text" id="en_name" value="${esc(u.name)}"></label>
    <div class="hint" style="margin-top:6px">${esc(u.email)}</div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveName('${id}',this)">Save</button></div>`);
}
function saveName(id, btn){
  const name = val('en_name').trim(); if (!name) return toast('Enter a name', true);
  run(async () => { await api('updateUser', { id, name }); closeModal(); await reloadUsers(); toast('Name updated'); }, btn);
}
function addUser(btn){
  const name = val('am_n').trim(), email = val('am_e').trim(); if (!name || !email) return toast('Enter a name and email', true);
  run(async () => { await api('addUser', { name, email, role: val('role_new') }); $('#am_n').value = ''; $('#am_e').value = ''; await reloadUsers(); toast(`${name} added — send them the app link`); }, btn);
}
function resetPw(id, btn){
  const u = S.users.users.find(x => x.id === id);
  if (!confirm(`Reset the password for ${u.name}? Their current password will stop working.`)) return;
  run(async () => {
    const r = await api('resetPassword', { id });
    openModal(`<h3>Temporary password</h3><p>Send this to <b>${esc(u.name)}</b> (${esc(u.email)}). They can change it after signing in using the <b>Password</b> button.</p>
      <div class="temp-pw">${esc(r.tempPassword)}</div><div class="mfoot"><button class="btn pri" onclick="closeModal()">Done</button></div>`);
  }, btn);
}
function changePasswordModal(){
  openModal(`<h3>Change your password</h3><div class="fgrid" style="grid-template-columns:1fr">
    <label class="f">New password (at least 8 characters)<input type="password" id="cp1" autocomplete="new-password"></label>
    <label class="f">Confirm new password<input type="password" id="cp2" autocomplete="new-password"></label></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="doChangePw(this)">Save</button></div>`);
}
function doChangePw(btn){
  if (val('cp1') !== val('cp2')) return toast('The passwords do not match', true);
  if (val('cp1').length < 8) return toast('Use at least 8 characters', true);
  run(async () => { await api('changePassword', { password: val('cp1') }); closeModal(); toast('Password changed'); }, btn);
}

/* ---------- Start ---------- */
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
boot();
// keep the login fresh while the page stays open
setInterval(() => { if (S.screen === 'app' && document.visibilityState === 'visible' && !document.getElementById('modal')) refreshSession(); }, 45 * 60 * 1000);
// service worker (Handbook 5.3) — network-first for the page so updates show right away
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
